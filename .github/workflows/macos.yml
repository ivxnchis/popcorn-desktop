name: macOS build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: macOS Apple Silicon .dmg
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          command -v yarn >/dev/null || npm install -g yarn
          yarn install --network-timeout 600000

      - name: Build .dmg
        run: bash dist/mac/build-dmg.sh

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-time-macos-arm64
          path: build/*.dmg
          if-no-files-found: error

      - name: Smoke test (app stays up for 20s)
        continue-on-error: true
        run: |
          APP="$(ls -d build/*/osx64/*.app)"
          EXE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          "$APP/Contents/MacOS/$EXE" > smoke.log 2>&1 &
          PID=$!
          sleep 20
          if kill -0 "$PID" 2>/dev/null; then
            echo "App is running"
            kill "$PID"
          else
            echo "App exited early"
            cat smoke.log
            exit 1
          fi

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.ref_name }}
          artifacts: build/*.dmg
