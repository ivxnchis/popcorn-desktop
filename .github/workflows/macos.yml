name: macOS build

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dmg:
    name: macOS Apple Silicon .dmg
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reconfigure git to use HTTP authentication
        run: >
          git config --global url."https://github.com/".insteadOf
          ssh://git@github.com/

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          command -v yarn >/dev/null || npm install -g yarn
          yarn install --network-timeout 600000

      - name: Build .dmg
        run: bash dist/mac/build-dmg.sh

      - name: Upload .dmg
        uses: actions/upload-artifact@v4
        with:
          name: popcorn-time-macos-arm64
          path: build/*.dmg
          if-no-files-found: error

      - name: Screenshots
        continue-on-error: true
        run: |
          status=0
          bash dist/mac/screenshots.sh screenshots || status=$?
          (cd screenshots && zip -qr ../screenshots.zip .)
          exit $status

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots
          if-no-files-found: warn

      - name: Publish "macOS latest build" pre-release
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > notes.md <<EOF
          Automatic build of \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, for Apple Silicon Macs. Replaced on every push.

          **Install:** open the .dmg and drag Popcorn-Time into Applications. The app isn't notarized, so macOS blocks the first launch: click **Done**, then go to System Settings → Privacy & Security and click **Open Anyway**.
          EOF
          gh release delete macos-latest --cleanup-tag --yes || true
          assets=(build/*.dmg)
          [ -f screenshots.zip ] && assets+=(screenshots.zip)
          gh release create macos-latest "${assets[@]}" --target "$GITHUB_SHA" --prerelease \
            --title "macOS latest build" --notes-file notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          name: ${{ github.ref_name }}
          artifacts: build/*.dmg
